# Builds a debug APK on every push to main, on pull requests, and on demand from the Actions tab.
# The APK is attached to the workflow run as the "StreamShield-debug-apk" artifact and (pushes to
# main) published as the "latest" pre-release, whose download link needs no GitHub account when
# the repository is public. Pushing a version tag (v1.0.0, v1.1.0, ...) publishes a permanent
# release named after the tag instead.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # replace the "latest" release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The repo has no gradlew script, so use the Gradle version from gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      # app/build.gradle.kts signs debug builds with ./debug.keystore, which is git-ignored.
      # Every APK must be signed with the same key for updates to install over each other, so
      # prefer a stored key (repository secret DEBUG_KEYSTORE_BASE64); otherwise create one.
      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; using a new signing key. Each build will need an uninstall before installing."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # A tag build is named after the tag (v1.2.0 -> 1.2.0); other builds after the commit.
      - name: Build debug APK
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PversionName="$VERSION"

      # Before anything is published: a failing build must not replace a release.
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/StreamShield.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: StreamShield-debug-apk
          path: dist/StreamShield.apk
          if-no-files-found: error

      # One fixed link for phones: Releases -> latest -> StreamShield.apk. Recreated each time so
      # the tag points at the commit that was built.
      - name: Publish the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest dist/StreamShield.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "StreamShield (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). On the phone: download StreamShield.apk, open it, and allow installing from this source. It installs over an earlier build only if both were signed with the same key (see README, Signing)."

      # A version tag: a permanent release, marked as the repository's latest release, so
      # .../releases/latest leads to it.
      - name: Publish the version release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/StreamShield.apk "dist/StreamShield-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "dist/StreamShield-$GITHUB_REF_NAME.apk" dist/StreamShield.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "StreamShield $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/
